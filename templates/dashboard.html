<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureTask - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Task Dashboard</h2>
        <a href="/profile" class="btn btn-outline-secondary">My Profile</a>
    </div>

    <!-- Search & Filter Bar -->
    <form method="GET" action="/dashboard" class="row g-2 mb-4">
        <div class="col-md-7">
            <input type="text" name="q" class="form-control" placeholder="Search tasks by title..." value="{{ search }}">
        </div>
        <div class="col-md-3">
            <select name="category" class="form-select">
                <option value="">All Categories</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Filter</button>
        </div>
    </form>

    <!-- Create Task Card -->
    <div class="card p-3 mb-4 shadow-sm">
        <h5>Add New Task</h5>
        <form method="POST" action="/task/create">
            <div class="mb-2">
                <input type="text" name="title" class="form-control" placeholder="Task Title" required>
            </div>
            <div class="mb-2">
                <textarea name="description" class="form-control" placeholder="Task Description"></textarea>
            </div>
            <div class="mb-3">
                <select name="category_id" class="form-select">
                    <option value="">Select Category (Optional)</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-success">Create Task</button>
        </form>
    </div>

    <!-- Task List -->
    <h5>Your Tasks</h5>
    <div class="list-group">
        {% for task in tasks %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <h6 class="mb-1">{{ task.title }}</h6>
                <p class="mb-1 text-muted">{{ task.description or 'No description provided.' }}</p>
                <span class="badge bg-info text-dark">{{ task.status }}</span>
                {% if task.category %}
                <span class="badge bg-secondary">{{ task.category.name }}</span>
                {% endif %}
            </div>
            <form action="/task/delete/{{ task.id }}" method="POST" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
        </div>
        {% else %}
        <p class="text-muted">No tasks found. Create one above!</p>
        {% endfor %}
    </div>
</body>
</html>
